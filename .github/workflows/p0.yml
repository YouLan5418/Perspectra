name: Prototype checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Enable the locked package manager
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Run lightweight checks
        run: corepack pnpm@11.7.0 check
