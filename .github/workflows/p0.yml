name: Prototype checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Enable the locked package manager
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Typecheck runtime and desktop
        run: corepack pnpm@11.7.0 typecheck
      - name: Lint runtime and desktop
        run: corepack pnpm@11.7.0 lint
      - name: Check Launcher
        run: corepack pnpm@11.7.0 launcher:check
      - name: Run prototype tests
        # SQLite, local HTTP and crash suites compete for resources on hosted
        # Windows runners. Keep every test and its deadline; serialize files.
        run: corepack pnpm@11.7.0 test --maxWorkers=1
