name: Phase 0 gates

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22.19.0, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable the locked package manager
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Run Phase 0 gates
        run: corepack pnpm@11.7.0 check
