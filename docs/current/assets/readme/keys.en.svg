<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="The player asks who saw the keys. Common AI roleplay puts everything in one shared chat log; Perspectra records facts in the world and gives each character only what it can see.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2433"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6478"/></marker>
</defs>
<style>text{font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans", sans-serif;fill:#1d2433} .s{font-size:12.5px;fill:#5b6478} .t{font-size:14px} .b{font-size:15px;font-weight:700} .h{font-size:16px;font-weight:700} .n{font-size:13px;font-weight:700;fill:#fff} .mono{font-family:Consolas,"SFMono-Regular",monospace;font-size:12px;fill:#5b6478}</style>
<rect width="960" height="430" rx="12" fill="#f7f8fb"/>
<text x="24" y="38" class="h" text-anchor="start" >The usual way: one shared chat log</text><rect x="24" y="54" width="380" height="252" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><rect x="40" y="78" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="100" class="t" text-anchor="start" >Player: Has anyone seen my keys?</text><rect x="40" y="122" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="144" class="t" text-anchor="start" >A: On the table, I think.</text><rect x="40" y="166" width="348" height="34" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1.4" /><text x="52" y="188" class="t" text-anchor="start" >(Narration) C slipped the keys into a pocket.</text><rect x="40" y="210" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="232" class="t" text-anchor="start" >B: ...</text><rect x="40" y="254" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="276" class="t" text-anchor="start" >The model writes what comes next</text><text x="24" y="330" class="s" text-anchor="start" >Every character shares this one text. Where the keys are and</text><text x="24" y="348" class="s" text-anchor="start" >who knows C’s secret is left to the model to remember.</text><text x="440" y="38" class="h" text-anchor="start" >Perspectra: the world keeps the record</text><rect x="440" y="54" width="496" height="92" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><text x="456" y="78" class="b" text-anchor="start" >World record (checked by rules)</text><text x="456" y="102" class="s" text-anchor="start" >The keys are in C’s pocket (C took them; only C saw)</text><text x="456" y="122" class="s" text-anchor="start" >The player spoke in the living room (heard there)</text><rect x="440" y="190" width="156" height="116" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="452" y="214" class="b" text-anchor="start" >Character A</text><text x="452" y="234" class="s" text-anchor="start" >Living room</text><text x="452" y="260" class="s" text-anchor="start" >Heard the question</text><text x="452" y="278" class="s" text-anchor="start" >Doesn’t know C took</text><text x="452" y="296" class="s" text-anchor="start" >the keys</text><path d="M518 146V188" fill="none" stroke="#5b6478" stroke-width="1.5"  marker-end="url(#m)"/><rect x="610" y="190" width="156" height="116" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="622" y="214" class="b" text-anchor="start" >Character B</text><text x="622" y="234" class="s" text-anchor="start" >Living room</text><text x="622" y="260" class="s" text-anchor="start" >Heard the question</text><text x="622" y="278" class="s" text-anchor="start" >Doesn’t know C took</text><text x="622" y="296" class="s" text-anchor="start" >the keys</text><path d="M688 146V188" fill="none" stroke="#5b6478" stroke-width="1.5"  marker-end="url(#m)"/><rect x="780" y="190" width="156" height="116" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.4" /><text x="792" y="214" class="b" text-anchor="start" >Character C</text><text x="792" y="234" class="s" text-anchor="start" >Kitchen</text><text x="792" y="260" class="s" text-anchor="start" >Didn’t hear it</text><text x="792" y="278" class="s" text-anchor="start" >Knows the keys are</text><text x="792" y="296" class="s" text-anchor="start" >in its own pocket</text><path d="M858 146V188" fill="none" stroke="#5b6478" stroke-width="1.5"  marker-end="url(#m)"/><text x="694" y="172" class="s" text-anchor="middle" style="paint-order:stroke;stroke:#f7f8fb;stroke-width:5px">Each gets only what it saw or heard</text><text x="440" y="330" class="s" text-anchor="start" >Each character calls the model on its own and decides what to say or do. A may</text><text x="440" y="348" class="s" text-anchor="start" >answer wrongly and C may hide the truth, but the keys stay where the rules put them.</text>
</svg>
