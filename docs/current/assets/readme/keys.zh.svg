<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="玩家问谁看见了钥匙：常见 AI 角色扮演把所有内容放进一段共享聊天记录；Perspectra 由世界记录事实，每个角色只看到自己能看到的。">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2433"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6478"/></marker>
</defs>
<style>text{font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans", sans-serif;fill:#1d2433} .s{font-size:12.5px;fill:#5b6478} .t{font-size:14px} .b{font-size:15px;font-weight:700} .h{font-size:16px;font-weight:700} .n{font-size:13px;font-weight:700;fill:#fff} .mono{font-family:Consolas,"SFMono-Regular",monospace;font-size:12px;fill:#5b6478}</style>
<rect width="960" height="430" rx="12" fill="#f7f8fb"/>
<text x="24" y="38" class="h" text-anchor="start" >常见做法：一段共享的聊天记录</text><rect x="24" y="54" width="380" height="252" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><rect x="40" y="78" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="100" class="t" text-anchor="start" >玩家：谁看见我的钥匙了？</text><rect x="40" y="122" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="144" class="t" text-anchor="start" >A：好像在桌上吧。</text><rect x="40" y="166" width="348" height="34" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1.4" /><text x="52" y="188" class="t" text-anchor="start" >（旁白）C 刚才在厨房把钥匙放进了口袋。</text><rect x="40" y="210" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="232" class="t" text-anchor="start" >B：……</text><rect x="40" y="254" width="348" height="34" rx="8" fill="#eceff4" stroke="#d5dae4" stroke-width="1.4" /><text x="52" y="276" class="t" text-anchor="start" >模型接着往下写</text><text x="24" y="330" class="s" text-anchor="start" >所有角色共用这一段文字。钥匙在哪、谁知道 C 的秘密，</text><text x="24" y="348" class="s" text-anchor="start" >都要靠模型自己记住、自己分辨。</text><text x="440" y="38" class="h" text-anchor="start" >Perspectra：世界记账，角色各看各的</text><rect x="440" y="54" width="496" height="92" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><text x="456" y="78" class="b" text-anchor="start" >世界记录（经规则裁定）</text><text x="456" y="102" class="s" text-anchor="start" >钥匙在 C 的口袋里（C 自己拿的，只有 C 看见）</text><text x="456" y="122" class="s" text-anchor="start" >玩家在客厅问了一句话（客厅里的人听得见）</text><rect x="440" y="190" width="156" height="116" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="452" y="214" class="b" text-anchor="start" >角色 A</text><text x="452" y="234" class="s" text-anchor="start" >在客厅</text><text x="452" y="260" class="s" text-anchor="start" >听见了玩家的问题</text><text x="452" y="278" class="s" text-anchor="start" >不知道钥匙被拿走</text><path d="M518 146V188" fill="none" stroke="#5b6478" stroke-width="1.5"  marker-end="url(#m)"/><rect x="610" y="190" width="156" height="116" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="622" y="214" class="b" text-anchor="start" >角色 B</text><text x="622" y="234" class="s" text-anchor="start" >在客厅</text><text x="622" y="260" class="s" text-anchor="start" >听见了玩家的问题</text><text x="622" y="278" class="s" text-anchor="start" >不知道钥匙被拿走</text><path d="M688 146V188" fill="none" stroke="#5b6478" stroke-width="1.5"  marker-end="url(#m)"/><rect x="780" y="190" width="156" height="116" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.4" /><text x="792" y="214" class="b" text-anchor="start" >角色 C</text><text x="792" y="234" class="s" text-anchor="start" >在厨房</text><text x="792" y="260" class="s" text-anchor="start" >没听见这个问题</text><text x="792" y="278" class="s" text-anchor="start" >知道钥匙在自己身上</text><path d="M858 146V188" fill="none" stroke="#5b6478" stroke-width="1.5"  marker-end="url(#m)"/><text x="694" y="172" class="s" text-anchor="middle" style="paint-order:stroke;stroke:#f7f8fb;stroke-width:5px">每人只拿到自己看到、听到的</text><text x="440" y="330" class="s" text-anchor="start" >每个角色单独调用模型，自己决定说什么、做什么。A 可能答错，</text><text x="440" y="348" class="s" text-anchor="start" >C 可以隐瞒；但钥匙的去向由规则记录，谁说错了也改不了它。</text>
</svg>
