<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Perspectra code layers: world packs, replaceable mechanisms, host, core; the launcher, stage, model service and Python memory run in separate processes.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2433"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6478"/></marker>
</defs>
<style>text{font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans", sans-serif;fill:#1d2433} .s{font-size:12.5px;fill:#5b6478} .t{font-size:14px} .b{font-size:15px;font-weight:700} .h{font-size:16px;font-weight:700} .n{font-size:13px;font-weight:700;fill:#fff} .mono{font-family:Consolas,"SFMono-Regular",monospace;font-size:12px;fill:#5b6478}</style>
<rect width="960" height="470" rx="12" fill="#f7f8fb"/>
<rect x="24" y="24" width="680" height="92" rx="8" fill="#f9e3ec" stroke="#b5185a" stroke-width="1.4" /><text x="40" y="50" class="h" text-anchor="start" >World pack</text><text x="40" y="70" class="s" text-anchor="start" >Written by creators and shipped with the work; no code changes needed</text><rect x="40" y="80" width="112.2" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="96.1" y="98" class="s" text-anchor="middle" >Cast &amp; places</text><rect x="158.2" y="80" width="112.2" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="214.29999999999998" y="98" class="s" text-anchor="middle" >Items &amp; state</text><rect x="276.4" y="80" width="90" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="321.4" y="98" class="s" text-anchor="middle" >Activities</text><rect x="372.4" y="80" width="104.80000000000001" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="424.79999999999995" y="98" class="s" text-anchor="middle" >Story pacing</text><rect x="483.2" y="80" width="75.2" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="520.8" y="98" class="s" text-anchor="middle" >Stage UI</text><text x="688" y="50" class="mono" text-anchor="end" >examples/world-packs/</text><path d="M144 116V132" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="24" y="132" width="680" height="92" rx="8" fill="#e7e6fb" stroke="#4f46e5" stroke-width="1.4" /><text x="40" y="158" class="h" text-anchor="start" >Replaceable mechanisms</text><text x="40" y="178" class="s" text-anchor="start" >Official defaults; players can swap in other plugins from the launcher</text><rect x="40" y="188" width="82.60000000000001" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="81.30000000000001" y="206" class="s" text-anchor="middle" >Scheduler</text><rect x="128.60000000000002" y="188" width="82.60000000000001" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="169.90000000000003" y="206" class="s" text-anchor="middle" >Turn loop</text><rect x="217.20000000000005" y="188" width="60.400000000000006" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="247.40000000000003" y="206" class="s" text-anchor="middle" >Memory</text><rect x="283.6" y="188" width="82.60000000000001" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="324.90000000000003" y="206" class="s" text-anchor="middle" >Knowledge</text><rect x="372.20000000000005" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="402.20000000000005" y="206" class="s" text-anchor="middle" >State</text><rect x="438.20000000000005" y="188" width="90" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="483.20000000000005" y="206" class="s" text-anchor="middle" >Activities</text><rect x="534.2" y="188" width="60.400000000000006" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="564.4000000000001" y="206" class="s" text-anchor="middle" >Pacing</text><rect x="600.6" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="630.6" y="206" class="s" text-anchor="middle" >Model</text><text x="688" y="158" class="mono" text-anchor="end" >packages/official-*</text><path d="M144 224V240" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="24" y="240" width="680" height="92" rx="8" fill="#f8ead8" stroke="#a85106" stroke-width="1.4" /><text x="40" y="266" class="h" text-anchor="start" >Host</text><text x="40" y="286" class="s" text-anchor="start" >Assembles a game: reads scripts, binds real characters, hands results to the core</text><rect x="40" y="296" width="75.2" height="26" rx="13" fill="#ffffff" stroke="#a85106" stroke-width="1.4" /><text x="77.6" y="314" class="s" text-anchor="middle" >HTTP API</text><rect x="121.2" y="296" width="149.20000000000002" height="26" rx="13" fill="#ffffff" stroke="#a85106" stroke-width="1.4" /><text x="195.8" y="314" class="s" text-anchor="middle" >Mechanism adapters</text><rect x="276.40000000000003" y="296" width="164" height="26" rx="13" fill="#ffffff" stroke="#a85106" stroke-width="1.4" /><text x="358.40000000000003" y="314" class="s" text-anchor="middle" >Saves &amp; regeneration</text><text x="688" y="266" class="mono" text-anchor="end" >desktop/host/</text><path d="M144 332V348" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="24" y="348" width="680" height="92" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><text x="40" y="374" class="h" text-anchor="start" >Core</text><text x="40" y="394" class="s" text-anchor="start" >Not replaceable: world facts and information boundaries are guaranteed here</text><rect x="40" y="404" width="127" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="103.5" y="422" class="s" text-anchor="middle" >World event log</text><rect x="173" y="404" width="119.60000000000001" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="232.8" y="422" class="s" text-anchor="middle" >Atomic commits</text><rect x="298.6" y="404" width="127" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="362.1" y="422" class="s" text-anchor="middle" >Character views</text><rect x="431.6" y="404" width="134.4" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="498.8" y="422" class="s" text-anchor="middle" >Saves &amp; branches</text><text x="688" y="374" class="mono" text-anchor="end" >packages/application · store-sqlite</text><text x="156" y="235" class="s" text-anchor="start" >Mechanisms compute results; they cannot write the world</text><text x="156" y="343" class="s" text-anchor="start" >Only the core changes the world</text><text x="728" y="44" class="h" text-anchor="start" >Where things run</text><rect x="728" y="60" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="84" class="b" text-anchor="start" >Launcher</text><text x="740" y="106" class="s" text-anchor="start" >Tauri + Vue desktop app</text><text x="740" y="123" class="s" text-anchor="start" >apps/launcher</text><rect x="728" y="158" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="182" class="b" text-anchor="start" >Game stage</text><text x="740" y="204" class="s" text-anchor="start" >Opens in your browser</text><text x="740" y="221" class="s" text-anchor="start" >packages/frontend</text><rect x="728" y="256" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="280" class="b" text-anchor="start" >Model service</text><text x="740" y="302" class="s" text-anchor="start" >Your own OpenAI-compatible,</text><text x="740" y="319" class="s" text-anchor="start" >Anthropic or Gemini API</text><rect x="728" y="354" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="378" class="b" text-anchor="start" >Long-term memory</text><text x="740" y="400" class="s" text-anchor="start" >A Python subprocess;</text><text x="740" y="417" class="s" text-anchor="start" >--memory-none turns it off</text>
</svg>
