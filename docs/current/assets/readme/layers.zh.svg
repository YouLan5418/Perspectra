<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Perspectra 的代码分层：世界包、可替换的机制、宿主、核心；另有启动器、舞台、模型服务和 Python 记忆在不同进程里运行。">
<defs>
