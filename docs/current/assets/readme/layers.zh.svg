<rect x="24" y="24" width="680" height="92" rx="8" fill="#f9e3ec" stroke="#b5185a" stroke-width="1.4" /><text x="40" y="50" class="h" text-anchor="start" >世界包</text><text x="40" y="70" class="s" text-anchor="start" >作者写，随作品分发，不需要改程序</text><rect x="40" y="80" width="86" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="83" y="98" class="s" text-anchor="middle" >人物与地点</text><rect x="132" y="80" width="86" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="175" y="98" class="s" text-anchor="middle" >物品与状态</text><rect x="224" y="80" width="60" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="254" y="98" class="s" text-anchor="middle" >活动</text><rect x="290" y="80" width="72" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="326" y="98" class="s" text-anchor="middle" >剧情节奏</text><rect x="368" y="80" width="72" height="26" rx="13" fill="#ffffff" stroke="#b5185a" stroke-width="1.4" /><text x="404" y="98" class="s" text-anchor="middle" >舞台界面</text><text x="688" y="50" class="mono" text-anchor="end" >examples/world-packs/</text><path d="M144 116V132" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="24" y="132" width="680" height="92" rx="8" fill="#e7e6fb" stroke="#4f46e5" stroke-width="1.4" /><text x="40" y="158" class="h" text-anchor="start" >可替换的机制</text><text x="40" y="178" class="s" text-anchor="start" >官方提供默认实现，玩家可在启动器里换成别的插件</text><rect x="40" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="70" y="206" class="s" text-anchor="middle" >调度</text><rect x="106" y="188" width="72" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="142" y="206" class="s" text-anchor="middle" >角色循环</text><rect x="184" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="214" y="206" class="s" text-anchor="middle" >记忆</text><rect x="250" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="280" y="206" class="s" text-anchor="middle" >知识</text><rect x="316" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="346" y="206" class="s" text-anchor="middle" >状态</text><rect x="382" y="188" width="60" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="412" y="206" class="s" text-anchor="middle" >活动</text><rect x="448" y="188" width="72" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="484" y="206" class="s" text-anchor="middle" >剧情节奏</text><rect x="526" y="188" width="72" height="26" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" /><text x="562" y="206" class="s" text-anchor="middle" >模型通道</text><text x="688" y="158" class="mono" text-anchor="end" >packages/official-*</text><path d="M144 224V240" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="24" y="240" width="680" height="92" rx="8" fill="#f8ead8" stroke="#a85106" stroke-width="1.4" /><text x="40" y="266" class="h" text-anchor="start" >宿主</text><text x="40" y="286" class="s" text-anchor="start" >一局游戏的总装配：读脚本、绑定真实角色、交给核心提交</text><rect x="40" y="296" width="114" height="26" rx="13" fill="#ffffff" stroke="#a85106" stroke-width="1.4" /><text x="97" y="314" class="s" text-anchor="middle" >HTTP 接口</text><rect x="160" y="296" width="100" height="26" rx="13" fill="#ffffff" stroke="#a85106" stroke-width="1.4" /><text x="210" y="314" class="s" text-anchor="middle" >各机制的适配</text><rect x="266" y="296" width="114" height="26" rx="13" fill="#ffffff" stroke="#a85106" stroke-width="1.4" /><text x="323" y="314" class="s" text-anchor="middle" >存档与重新生成</text><text x="688" y="266" class="mono" text-anchor="end" >desktop/host/</text><path d="M144 332V348" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="24" y="348" width="680" height="92" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><text x="40" y="374" class="h" text-anchor="start" >核心</text><text x="40" y="394" class="s" text-anchor="start" >不可替换：世界事实和信息边界都在这里保证</text><rect x="40" y="404" width="100" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="90" y="422" class="s" text-anchor="middle" >世界事件日志</text><rect x="146" y="404" width="72" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="182" y="422" class="s" text-anchor="middle" >原子提交</text><rect x="224" y="404" width="72" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="260" y="422" class="s" text-anchor="middle" >角色视图</text><rect x="302" y="404" width="86" height="26" rx="13" fill="#ffffff" stroke="#0d8478" stroke-width="1.4" /><text x="345" y="422" class="s" text-anchor="middle" >存档与分支</text><text x="688" y="374" class="mono" text-anchor="end" >packages/application · store-sqlite</text><text x="156" y="235" class="s" text-anchor="start" >机制只算结果，不能直接写世界</text><text x="156" y="343" class="s" text-anchor="start" >只有核心能改世界</text><text x="728" y="44" class="h" text-anchor="start" >各自在哪里运行</text><rect x="728" y="60" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="84" class="b" text-anchor="start" >启动器</text><text x="740" y="106" class="s" text-anchor="start" >Tauri + Vue 桌面程序</text><text x="740" y="123" class="s" text-anchor="start" >apps/launcher</text><rect x="728" y="158" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="182" class="b" text-anchor="start" >游戏舞台</text><text x="740" y="204" class="s" text-anchor="start" >在系统浏览器里打开</text><text x="740" y="221" class="s" text-anchor="start" >packages/frontend</text><rect x="728" y="256" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="280" class="b" text-anchor="start" >模型服务</text><text x="740" y="302" class="s" text-anchor="start" >你自己的 OpenAI 兼容、</text><text x="740" y="319" class="s" text-anchor="start" >Anthropic 或 Gemini 接口</text><rect x="728" y="354" width="208" height="84" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><text x="740" y="378" class="b" text-anchor="start" >长期记忆</text><text x="740" y="400" class="s" text-anchor="start" >Python 子进程，</text><text x="740" y="417" class="s" text-anchor="start" >可用 --memory-none 关掉</text>
