<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="What happens in a round: the player acts, rules check and record it, it reaches the characters who could see it, each decides on its own, their actions are checked again, and the round ends with values, activities and story pacing.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2433"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6478"/></marker>
</defs>
<style>text{font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans", sans-serif;fill:#1d2433} .s{font-size:12.5px;fill:#5b6478} .t{font-size:14px} .b{font-size:15px;font-weight:700} .h{font-size:16px;font-weight:700} .n{font-size:13px;font-weight:700;fill:#fff} .mono{font-family:Consolas,"SFMono-Regular",monospace;font-size:12px;fill:#5b6478}</style>
<rect width="960" height="320" rx="12" fill="#f7f8fb"/>
<rect x="24" y="64" width="136" height="156" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><circle cx="44" cy="86" r="11" fill="#5b6478"/><text x="44" y="91" class="n" text-anchor="middle" >1</text><text x="36" y="122" class="b" text-anchor="start" >Player acts</text><text x="36" y="153" class="s" text-anchor="start" >Says something</text><text x="36" y="170" class="s" text-anchor="start" >or picks an</text><text x="36" y="187" class="s" text-anchor="start" >action</text><path d="M160 86H178" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="180" y="64" width="136" height="156" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><circle cx="200" cy="86" r="11" fill="#0d8478"/><text x="200" y="91" class="n" text-anchor="middle" >2</text><text x="192" y="122" class="b" text-anchor="start" >Rules check</text><text x="192" y="141" class="b" text-anchor="start" >and record</text><text x="192" y="172" class="s" text-anchor="start" >Only this step</text><text x="192" y="189" class="s" text-anchor="start" >changes the world,</text><text x="192" y="206" class="s" text-anchor="start" >e.g. who holds what</text><path d="M316 86H334" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="336" y="64" width="136" height="156" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><circle cx="356" cy="86" r="11" fill="#0d8478"/><text x="356" y="91" class="n" text-anchor="middle" >3</text><text x="348" y="122" class="b" text-anchor="start" >Reach who</text><text x="348" y="141" class="b" text-anchor="start" >was there</text><text x="348" y="172" class="s" text-anchor="start" >Only those present</text><text x="348" y="189" class="s" text-anchor="start" >see or hear it</text><path d="M472 86H490" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="492" y="64" width="136" height="156" rx="8" fill="#e7e6fb" stroke="#4f46e5" stroke-width="1.4" /><circle cx="512" cy="86" r="11" fill="#4f46e5"/><text x="512" y="91" class="n" text-anchor="middle" >4</text><text x="504" y="122" class="b" text-anchor="start" >Each</text><text x="504" y="141" class="b" text-anchor="start" >decides</text><text x="504" y="172" class="s" text-anchor="start" >One model call</text><text x="504" y="189" class="s" text-anchor="start" >each: reply, act</text><text x="504" y="206" class="s" text-anchor="start" >or stay silent</text><path d="M628 86H646" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="648" y="64" width="136" height="156" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><circle cx="668" cy="86" r="11" fill="#5b6478"/><text x="668" y="91" class="n" text-anchor="middle" >5</text><text x="660" y="122" class="b" text-anchor="start" >Actions</text><text x="660" y="141" class="b" text-anchor="start" >checked again</text><text x="660" y="172" class="s" text-anchor="start" >Saying “I took</text><text x="660" y="189" class="s" text-anchor="start" >the keys” isn’t</text><text x="660" y="206" class="s" text-anchor="start" >enough; take them</text><path d="M784 86H802" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="804" y="64" width="136" height="156" rx="8" fill="#f8ead8" stroke="#a85106" stroke-width="1.4" /><circle cx="824" cy="86" r="11" fill="#a85106"/><text x="824" y="91" class="n" text-anchor="middle" >6</text><text x="816" y="122" class="b" text-anchor="start" >Round ends</text><text x="816" y="153" class="s" text-anchor="start" >Values change,</text><text x="816" y="170" class="s" text-anchor="start" >activities start,</text><text x="816" y="187" class="s" text-anchor="start" >small events</text><path d="M716 220V254H248V222" fill="none" stroke="#5b6478" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m)"/><text x="482" y="248" class="s" text-anchor="middle" >A character’s action is new to the others, until nobody needs to respond or the limits are reached</text><text x="24" y="32" class="h" text-anchor="start" >What happens in one round</text><text x="24" y="280" class="s" text-anchor="start" >The model plays the characters; rules keep the facts that matter. The cost: a model call per character, so a round often takes ten to tens of seconds.</text>
</svg>
