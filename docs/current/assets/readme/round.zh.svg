<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="一轮里发生的事：玩家行动，规则裁定并记录，按位置分发给能看到的角色，角色各自决定，角色的行动再经裁定，回合结束时处理状态、活动和剧情节奏。">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2433"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6478"/></marker>
</defs>
<style>text{font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans", sans-serif;fill:#1d2433} .s{font-size:12.5px;fill:#5b6478} .t{font-size:14px} .b{font-size:15px;font-weight:700} .h{font-size:16px;font-weight:700} .n{font-size:13px;font-weight:700;fill:#fff} .mono{font-family:Consolas,"SFMono-Regular",monospace;font-size:12px;fill:#5b6478}</style>
<rect width="960" height="320" rx="12" fill="#f7f8fb"/>
<rect x="24" y="64" width="136" height="156" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><circle cx="44" cy="86" r="11" fill="#5b6478"/><text x="44" y="91" class="n" text-anchor="middle" >1</text><text x="36" y="122" class="b" text-anchor="start" >玩家行动</text><text x="36" y="153" class="s" text-anchor="start" >说一句话，</text><text x="36" y="170" class="s" text-anchor="start" >或选一个操作</text><path d="M160 86H178" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="180" y="64" width="136" height="156" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><circle cx="200" cy="86" r="11" fill="#0d8478"/><text x="200" y="91" class="n" text-anchor="middle" >2</text><text x="192" y="122" class="b" text-anchor="start" >规则裁定</text><text x="192" y="141" class="b" text-anchor="start" >并记录</text><text x="192" y="172" class="s" text-anchor="start" >只有这一步能</text><text x="192" y="189" class="s" text-anchor="start" >改变世界，比如</text><text x="192" y="206" class="s" text-anchor="start" >物品归谁</text><path d="M316 86H334" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="336" y="64" width="136" height="156" rx="8" fill="#dcf1ee" stroke="#0d8478" stroke-width="1.4" /><circle cx="356" cy="86" r="11" fill="#0d8478"/><text x="356" y="91" class="n" text-anchor="middle" >3</text><text x="348" y="122" class="b" text-anchor="start" >按位置</text><text x="348" y="141" class="b" text-anchor="start" >分发</text><text x="348" y="172" class="s" text-anchor="start" >谁在场，谁才</text><text x="348" y="189" class="s" text-anchor="start" >看得到、听得到</text><path d="M472 86H490" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="492" y="64" width="136" height="156" rx="8" fill="#e7e6fb" stroke="#4f46e5" stroke-width="1.4" /><circle cx="512" cy="86" r="11" fill="#4f46e5"/><text x="512" y="91" class="n" text-anchor="middle" >4</text><text x="504" y="122" class="b" text-anchor="start" >角色各自</text><text x="504" y="141" class="b" text-anchor="start" >决定</text><text x="504" y="172" class="s" text-anchor="start" >每人调用一次</text><text x="504" y="189" class="s" text-anchor="start" >模型：回应、</text><text x="504" y="206" class="s" text-anchor="start" >行动或沉默</text><path d="M628 86H646" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="648" y="64" width="136" height="156" rx="8" fill="#ffffff" stroke="#d5dae4" stroke-width="1.4" /><circle cx="668" cy="86" r="11" fill="#5b6478"/><text x="668" y="91" class="n" text-anchor="middle" >5</text><text x="660" y="122" class="b" text-anchor="start" >行动再经</text><text x="660" y="141" class="b" text-anchor="start" >裁定</text><text x="660" y="172" class="s" text-anchor="start" >角色说“我拿走</text><text x="660" y="189" class="s" text-anchor="start" >钥匙”不算数，</text><text x="660" y="206" class="s" text-anchor="start" >要真的去拿</text><path d="M784 86H802" fill="none" stroke="#1d2433" stroke-width="1.5"  marker-end="url(#a)"/><rect x="804" y="64" width="136" height="156" rx="8" fill="#f8ead8" stroke="#a85106" stroke-width="1.4" /><circle cx="824" cy="86" r="11" fill="#a85106"/><text x="824" y="91" class="n" text-anchor="middle" >6</text><text x="816" y="122" class="b" text-anchor="start" >回合结束</text><text x="816" y="153" class="s" text-anchor="start" >数值变化、活动</text><text x="816" y="170" class="s" text-anchor="start" >开始、偶尔来一</text><text x="816" y="187" class="s" text-anchor="start" >件小插曲</text><path d="M716 220V254H248V222" fill="none" stroke="#5b6478" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m)"/><text x="482" y="248" class="s" text-anchor="middle" >角色的新行动又成为别人的新见闻，直到没人要回应或次数用完</text><text x="24" y="32" class="h" text-anchor="start" >一轮里发生了什么</text><text x="24" y="280" class="s" text-anchor="start" >模型只负责扮演角色；世界里重要的事实由规则维护。代价是每个角色要单独调用模型，一轮往往要等十几秒到几十秒。</text>
</svg>
