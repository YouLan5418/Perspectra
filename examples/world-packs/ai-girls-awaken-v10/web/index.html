<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一觉醒来，我的大模型们都变成了美少女</title>
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div><p class="eyebrow">CORDIS WORLD · AI GIRLS</p><h1 id="world-title">一觉醒来，我的大模型们都变成了美少女</h1></div>
      <div id="status" class="status">正在连接</div>
    </header>
    <div class="columns">
      <aside class="sidebar">
        <section class="card"><h2>此刻</h2><p id="scene">正在读取场景……</p></section>
        <section class="card"><h2>可以尝试</h2><div id="available" class="choices"></div></section>
        <section class="card"><h2>当前波次</h2><p id="notice" role="status"></p><button id="pause" type="button" class="quiet">暂停 NPC 反应</button></section>
      </aside>
      <section class="story" aria-label="对话与叙事">
        <div class="story-top"><span>共同生活 · 第一章</span><span>玩家推动的世界</span></div>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <form id="composer" class="composer">
          <label for="input">你想说什么？</label>
          <textarea id="input" maxlength="2000" required placeholder="对眼前的人说些什么……"></textarea>
          <div class="composer-bottom"><small>Enter 发送，Shift + Enter 换行</small><button id="send" type="submit">发送</button></div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
