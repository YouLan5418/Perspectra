packages:
  - packages/*
  - apps/*

nodeLinker: hoisted
strictDepBuilds: true
verifyDepsBeforeRun: false

allowBuilds:
  # CPU bindings ship in the pinned npm package; do not download optional CUDA payloads.
  onnxruntime-node: false
  esbuild: true
  electron: true
  electron-winstaller: true
  '@google/genai': false
  protobufjs: false
